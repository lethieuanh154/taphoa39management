<ng-container *ngIf="authState$ | async as auth">
  <!--
    IMPORTANT: a SINGLE router-outlet, never wrapped in an auth *ngIf.
    Previously two outlets sat inside *ngIf="auth.isAuthenticated" /
    *ngIf="!auth.isAuthenticated", so any auth-state flip destroyed and
    re-created the active page, wiping in-memory work (e.g. the product list
    on /edit-products). Only the sidebar is toggled now; redirecting an
    unauthenticated user is the guard's job.
  -->
  <div class="management-layout" [class.sidebar-collapsed]="sidebarCollapsed"
    [class.no-sidebar]="!auth.isAuthenticated">
    <nav class="sidebar" *ngIf="auth.isAuthenticated">
      <div class="sidebar-header">
        <span class="logo" *ngIf="!sidebarCollapsed">Quản Lý</span>
        <button class="toggle-btn" (click)="toggleSidebar()">
          <i class="fa-solid" [ngClass]="sidebarCollapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
        </button>
      </div>
      <a class="nav-item" routerLink="/edit-products" routerLinkActive="active">
        <i class="fa-solid fa-box-open"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed">Hàng hóa</span>
      </a>
      <a class="nav-item" routerLink="/orders" routerLinkActive="active">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed">Đơn hàng</span>
      </a>

      <div class="nav-group">
        <div class="nav-item nav-group-header" (click)="showEmployeeSubmenu = !showEmployeeSubmenu"
          [class.active]="showEmployeeSubmenu">
          <i class="fa-solid fa-users"></i>
          <span class="nav-text" *ngIf="!sidebarCollapsed">Nhân viên</span>
          <i class="fa-solid fa-chevron-down submenu-arrow" *ngIf="!sidebarCollapsed"
            [class.rotated]="showEmployeeSubmenu"></i>
        </div>
        <div class="submenu" *ngIf="showEmployeeSubmenu && !sidebarCollapsed">
          <a class="nav-item sub" routerLink="/employees" routerLinkActive="active">
            <i class="fa-solid fa-list"></i>
            <span class="nav-text">Danh sách</span>
          </a>
          <a class="nav-item sub" routerLink="/work-schedule" routerLinkActive="active">
            <i class="fa-solid fa-calendar-days"></i>
            <span class="nav-text">Lịch làm việc</span>
          </a>
          <a class="nav-item sub" routerLink="/attendance" routerLinkActive="active">
            <i class="fa-solid fa-clipboard-check"></i>
            <span class="nav-text">Chấm công</span>
          </a>
          <a class="nav-item sub" routerLink="/payroll" routerLinkActive="active">
            <i class="fa-solid fa-money-bill-wave"></i>
            <span class="nav-text">Bảng lương</span>
          </a>
        </div>
      </div>

      <a class="nav-item" routerLink="/customers" routerLinkActive="active">
        <i class="fa-solid fa-address-book"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed">Khách hàng</span>
      </a>

      <a class="nav-item" routerLink="/delivery" routerLinkActive="active">
        <i class="fa-solid fa-truck"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed">Giao hàng</span>
      </a>

      <a class="nav-item" routerLink="/promotions" routerLinkActive="active">
        <i class="fa-solid fa-tags"></i>
        <span class="nav-text" *ngIf="!sidebarCollapsed">Khuyến mãi</span>
      </a>

      <!-- User info & Logout -->
      <div class="sidebar-footer">
        <div class="user-info" *ngIf="auth.user && !sidebarCollapsed">
          <img [src]="auth.user.photoURL" alt="" class="user-avatar" *ngIf="auth.user.photoURL">
          <span class="user-email">{{ auth.user.email }}</span>
        </div>
        <button class="nav-item logout-btn" (click)="logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="nav-text" *ngIf="!sidebarCollapsed">Đăng xuất</span>
        </button>
      </div>
    </nav>

    <main class="content">
      <!-- Session expiry notice: emitTokenExpired() had no UI before, so users
           were dropped to /login with no explanation and no chance to react. -->
      <div class="session-banner" *ngIf="sessionExpired$ | async">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span class="session-banner-text">{{ sessionMessage$ | async }}</span>
        <button type="button" class="session-banner-action" (click)="relogin()">Đăng nhập lại</button>
        <button type="button" class="session-banner-close" (click)="dismissSessionBanner()">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <router-outlet></router-outlet>
    </main>

    <app-chat-bubble *ngIf="auth.isAuthenticated"></app-chat-bubble>
  </div>
</ng-container>
